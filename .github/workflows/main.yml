name: تحديث بيانات حلبة المشتريات
on:
  schedule:
    - cron: "55 * * * *"   # every hour
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest data from Google Drive
        run: |
          curl -sSL "https://drive.google.com/uc?export=download&id=1PCWlB1WduLcX0XsVY1u1biEgJQR7GXlf" -o new.json
          python3 -c "import json;d=json.load(open('new.json'));assert d['buyers'] and d['q'];print(len(d['q']),'quotes, updated',d.get('updated'))"
          mv new.json data.json
      - name: Commit if changed
        run: |
          git config user.name "procurement-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "تحديث البيانات $(date -u +'%Y-%m-%d %H:%M')"
          git push
